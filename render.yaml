services:
  - type: web
    name: resolveai
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RESOLVEAI_CONFIG_PATH
        value: config/resolveai.yaml
